  version: 1.0.6
  name: OpenVPN Client
  slug: openvpn_client
  description: OpenVPN Client
  url: https://github.com/tomeer72/openvpn-addon
  arch: 
    - aarch64
  startup: system
  boot: auto
  host_network: true,
  privileged: 
    - NET_ADMIN
  options: 
    ovpnfile: "client.ovpn"
  
  schema: 
    log_level: list(trace|debug|info|notice|warning|error|fatal)?
    ovpnfile: str
   
  map : 
    - share:rw
